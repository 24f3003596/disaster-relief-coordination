{% extends 'base.html' %}{% block content %}<h1>Notifications</h1><table class="table table-striped"><tr><th>ID</th><th>User ID</th><th>Message</th><th>Type</th><th>Read?</th><th>Action</th></tr>{% for n in notifications %}<tr><td>{{n.notification_id}}</td><td>{{n.user_id}}</td><td>{{n.message}}</td><td>{{n.type}}</td><td>{{'Yes' if n.is_read else 'No'}}</td><td>{% if not n.is_read %}<form method="post" action="/notifications/{{n.notification_id}}/read" class="d-flex gap-1"><input type="hidden" name="user_id" value="{{n.user_id}}"><button class="btn btn-sm btn-outline-primary">Mark read</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
