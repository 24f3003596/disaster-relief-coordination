{% extends 'base.html' %}{% block content %}<h1>Register user</h1><form method="post" class="form-card"><label class="form-label">Name</label><input class="form-control mb-3" name="name" required><label class="form-label">Phone</label><input class="form-control mb-3" name="phone"><label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required><label class="form-label">Password (8+ characters)</label><input class="form-control mb-3" name="password" type="password" required minlength="8"><label class="form-label">Role</label><select class="form-select mb-3" name="role"><option>Victim</option><option>Volunteer</option><option>Coordinator</option><option>Admin</option></select><button class="btn btn-primary">Register</button></form>{% endblock %}
