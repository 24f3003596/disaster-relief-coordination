{% extends 'base.html' %}{% block content %}<h1>Allocate & track assignments</h1><form method="post" class="form-card row g-2"><div class="col-md-4"><label>Pending request</label><select class="form-select" name="request_id" required>{% for r in requests %}<option value="{{r.request_id}}">#{{r.request_id}} — {{r.category}} × {{r.quantity}} ({{r.urgency}})</option>{% endfor %}</select></div><div class="col-md-4"><label>Volunteer</label><select class="form-select" name="volunteer_id" required>{% for v in volunteers %}<option value="{{v.user_id}}">#{{v.user_id}} — {{v.name}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Matching stock item</label><select class="form-select" name="item_id" required>{% for i in items %}<option value="{{i.item_id}}">#{{i.item_id}} — {{i.category}}, stock {{i.quantity}}</option>{% endfor %}</select></div><div><button class="btn btn-primary mt-2">Allocate resources</button></div></form><h2 class="mt-4">Assignment tracking</h2><table class="table table-striped"><tr><th>Task</th><th>Request</th><th>Volunteer</th><th>Item</th><th>Quantity</th><th>Status</th><th>Update</th></tr>{% for a in assignments %}<tr><td>{{a.task_id}}</td><td>{{a.request_id}}</td><td>{{a.volunteer.name}}</td><td>{{a.item.category}}</td><td>{{a.quantity_assigned}}</td><td>{{a.status}}</td><td><form method="post" action="/assignments/{{a.task_id}}/status" class="d-flex gap-1"><select name="status" class="form-select form-select-sm">{% for s in ['Assigned','Accepted','In Progress','Completed','Unable to Complete'] %}<option {% if s==a.status %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button class="btn btn-sm btn-outline-primary">Save</button></form></td></tr>{% endfor %}</table>{% endblock %}
