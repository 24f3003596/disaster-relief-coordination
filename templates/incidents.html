{% extends 'base.html' %}{% block content %}<h1>Disaster incidents</h1><form method="post" class="form-card row g-2"><div class="col-md-4"><label>Title</label><input class="form-control" name="title" required></div><div class="col-md-8"><label>Description</label><input class="form-control" name="description"></div><div class="col-md-3"><label>Latitude</label><input class="form-control" name="latitude" type="number" step="any" required></div><div class="col-md-3"><label>Longitude</label><input class="form-control" name="longitude" type="number" step="any" required></div><div class="col-md-3"><label>Severity</label><select class="form-select" name="severity"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></div><div class="col-md-3"><label>Reported by</label><select class="form-select" name="reported_by">{% for u in users %}<option value="{{u.user_id}}">#{{u.user_id}} {{u.name}}</option>{% endfor %}</select></div><div><button class="btn btn-primary mt-2">Register incident</button></div></form><table class="table mt-4"><tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Coordinates</th></tr>{% for i in incidents %}<tr><td>{{i.incident_id}}</td><td>{{i.title}}</td><td>{{i.severity}}</td><td>{{i.status}}</td><td>{{i.latitude}}, {{i.longitude}}</td></tr>{% endfor %}</table>{% endblock %}
